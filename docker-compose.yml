services:
  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      DH_BUILD_DIR: /workspace/.docker-build
      DH_MODELS_DIR: /workspace/models
      DH_SERVER_STATE_DIR: /workspace/.server-state
      DH_TASK_TIMEOUT_S: 300
    volumes:
      - .:/workspace
      - task-state:/workspace/.server-state
    expose:
      - "8000"
    command: ["uvicorn", "server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  task-state:
